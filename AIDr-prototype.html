<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIDr. — Interactive Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   AIDr. prototype — one stylesheet, one rule set.
   Every screen consumes the same component classes; there are no per-screen
   overrides, so a component change lands everywhere at once.
   ══════════════════════════════════════════════════════════════════════════ */

:root{
  /* Accent ramps. Switching --accent-* is the whole theming mechanism. */
  --clay:#B4552F;      --clay-soft:#F0DDD2;   --clay-deep:#8E4223;
  --sage:#5F7550;      --sage-soft:#DFE5D6;   --sage-deep:#48583D;
  --amber:#A9791B;     --amber-soft:#F1E3C6;  --amber-deep:#7F5A11;
  --rose:#9B4F62;      --rose-soft:#EFD9DE;   --rose-deep:#77394A;

  --accent:var(--clay); --accent-soft:var(--clay-soft); --accent-deep:var(--clay-deep);

  --canvas:#F1ECE2;  --surface:#FAF7F1;  --sunken:#E9E2D5;  --raised:#fff;
  --border:#DCD3C2;  --hairline:rgba(42,50,39,.09);
  --ink:#2A3227;     --ink-soft:#5A6355;  --ink-muted:#78806F;  --on-ink:#F5F1E8;

  --removed-fg:#A44227; --removed-bg:#F2DCD4;
  --kept-fg:#4A5842;    --kept-bg:#DEE4D5;
  --caution-fg:#8A6108; --caution-bg:#F5E7C8;

  /* uiscale — every dimension below derives from this, so the whole UI scales
     proportionately rather than reflowing unpredictably. */
  --ui:1;
  --s1:calc(4px*var(--ui));  --s2:calc(8px*var(--ui));  --s3:calc(12px*var(--ui));
  --s4:calc(16px*var(--ui)); --s5:calc(20px*var(--ui)); --s6:calc(24px*var(--ui));
  --s8:calc(32px*var(--ui)); --s11:calc(44px*var(--ui));
  --r-card:calc(22px*var(--ui)); --r-field:calc(18px*var(--ui));
  --r-cta:calc(26px*var(--ui)); --r-chip:999px; --r-tab:calc(32px*var(--ui));

  --shadow-card:0 3px 12px rgba(58,50,34,.05);
  --shadow-float:0 8px 24px rgba(42,36,24,.14);
  --serif:'Newsreader',Georgia,serif;
  --sans:'Inter',-apple-system,system-ui,sans-serif;
}

[data-theme="dark"]{
  --canvas:#171A15; --surface:#22261F; --sunken:#1B1F19; --raised:#2A2F26;
  --border:#333930; --hairline:rgba(241,236,226,.11);
  --ink:#EDE8DE;    --ink-soft:#B9BEB1; --ink-muted:#8D9385; --on-ink:#171A15;
  --removed-fg:#E08B6C; --removed-bg:rgba(164,66,39,.26);
  --kept-fg:#A9BE95;    --kept-bg:rgba(74,88,66,.32);
  --caution-fg:#D9B45E; --caution-bg:rgba(138,97,8,.28);
  --shadow-card:0 3px 14px rgba(0,0,0,.28);
  --shadow-float:0 10px 28px rgba(0,0,0,.45);
}
[data-theme="dark"][data-darkstyle="warm"]{ --canvas:#1C1A16; }
[data-theme="dark"][data-darkstyle="dim"]{ --canvas:#131512; --surface:#171A15; --raised:#22261F; }

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--sans);background:#E4DED2;color:var(--ink);
  min-height:100vh;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
[data-theme="dark"] body{background:#0D0F0C}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;text-align:left}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ── Chrome ──────────────────────────────────────────────────────────────── */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.rail{
  background:#20261E;color:#E8E3D8;padding:22px 18px;
  display:flex;flex-direction:column;gap:22px;overflow-y:auto;
}
.rail h1{font-family:var(--serif);font-size:26px;font-weight:500;letter-spacing:-.4px}
.rail .tag{font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:#B4552F;font-weight:600}
.rail-group{display:flex;flex-direction:column;gap:2px}
.rail-label{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:#7B8175;font-weight:600;margin:12px 0 5px}
.rail button{
  padding:8px 11px;border-radius:9px;font-size:13.5px;color:#C8C3B7;
  transition:background .15s,color .15s;
}
.rail button:hover{background:rgba(255,255,255,.07);color:#F0EBE1}
.rail button[aria-current="true"]{background:var(--accent);color:#fff;font-weight:500}
.controls{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:18px;border-top:1px solid rgba(255,255,255,.1)}
.ctl{padding:6px 11px;border-radius:999px;border:1px solid rgba(255,255,255,.2);font-size:11.5px;color:#C8C3B7}
.ctl[aria-pressed="true"]{background:#F0EBE1;color:#20261E;border-color:#F0EBE1}
.dots{display:flex;gap:7px;margin-top:8px}
.dot{width:24px;height:24px;border-radius:50%;border:2px solid transparent}
.dot[aria-pressed="true"]{border-color:#F0EBE1}

.stage{display:flex;align-items:flex-start;justify-content:center;padding:34px 22px;overflow-y:auto}
.frame{
  width:390px;flex:0 0 390px;height:844px;border-radius:44px;
  background:var(--canvas);box-shadow:var(--shadow-float),0 0 0 10px #2A3227;
  overflow:hidden;position:relative;display:flex;flex-direction:column;
}
.statusbar{
  display:flex;justify-content:space-between;align-items:center;
  padding:12px var(--s6) 2px;font-size:13.5px;font-weight:600;flex:0 0 auto;
}
.scroll{flex:1;overflow-y:auto;padding:var(--s3) var(--s5) 8px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.footer{
  flex:0 0 auto;padding:var(--s3) var(--s5) var(--s5);
  border-top:1px solid var(--hairline);background:var(--canvas);
}
.caption-under{
  flex:0 0 390px;max-width:390px;font-size:13px;color:#5A5347;
  padding-left:8px;line-height:1.65;
}
[data-theme="dark"] .caption-under{color:#9A9384}
.caption-under strong{display:block;font-size:15px;color:#2A3227;margin-bottom:5px;font-family:var(--serif);font-weight:600}
[data-theme="dark"] .caption-under strong{color:#E8E3D8}

/* ── Components ──────────────────────────────────────────────────────────── */
.eyebrow{
  font-size:calc(12.5px*var(--ui));letter-spacing:1.3px;text-transform:uppercase;
  font-weight:600;color:var(--accent);
}
.eyebrow.muted{color:var(--ink-muted)}
.display{
  font-family:var(--serif);font-weight:500;letter-spacing:-.7px;line-height:1.14;
  font-size:calc(38px*var(--ui));
}
.display.sm{font-size:calc(27px*var(--ui));letter-spacing:-.35px;line-height:1.2}
.display em{font-style:italic;color:var(--accent);font-weight:500}
.title{font-size:calc(18.5px*var(--ui));font-weight:600;letter-spacing:-.2px;line-height:1.32}
.body{font-size:calc(15.5px*var(--ui));line-height:1.5}
.soft{color:var(--ink-soft)}
.muted{color:var(--ink-muted)}
.cap{font-size:calc(13px*var(--ui));line-height:1.48;color:var(--ink-soft)}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:calc(12.5px*var(--ui));color:var(--ink-muted)}

.card{
  background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-card);
  padding:var(--s5);box-shadow:var(--shadow-card);
}
.card.sunken{background:var(--sunken);border-color:transparent;box-shadow:none}
.card.ink{background:var(--ink);border-color:transparent;color:var(--on-ink)}
.card.ink .cap{color:rgba(241,236,226,.72)}
.card.flat{padding:0;overflow:hidden}
.card.alert{background:var(--removed-bg);border:1.5px solid var(--removed-fg)}
.row{display:flex;align-items:center;gap:var(--s3)}
.row.top{align-items:flex-start}
.row.between{justify-content:space-between}
.col{display:flex;flex-direction:column}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:var(--s3)}
.stack.tight{gap:var(--s2)}
.section{margin-top:var(--s6)}
.section>.eyebrow{display:block;margin-bottom:var(--s3)}
.hr{height:1px;background:var(--hairline);margin:var(--s3) 0}

.btn{
  display:flex;align-items:center;justify-content:center;gap:var(--s2);
  min-height:calc(54px*var(--ui));padding:0 var(--s5);border-radius:var(--r-cta);
  background:var(--ink);color:var(--on-ink);font-weight:600;
  font-size:calc(16.5px*var(--ui));width:100%;transition:opacity .15s;
}
.btn:hover{opacity:.9}
.btn.arrow{justify-content:space-between}
.btn.secondary{background:var(--surface);color:var(--ink);border:1px solid var(--border)}
.btn.quiet{background:none;color:var(--ink);min-height:calc(46px*var(--ui))}
.btn.inline{width:auto;min-height:calc(42px*var(--ui));padding:0 var(--s4);font-size:calc(15px*var(--ui))}
.btn[disabled]{opacity:.42;cursor:not-allowed}
.btn.danger{background:none;color:var(--removed-fg);justify-content:flex-start}

.chip{
  display:inline-flex;align-items:center;gap:5px;padding:var(--s2) var(--s4);
  border-radius:var(--r-chip);background:var(--surface);border:1px solid var(--border);
  font-size:calc(12.5px*var(--ui));letter-spacing:1.2px;text-transform:uppercase;
  font-weight:600;color:var(--ink-soft);min-height:calc(38px*var(--ui));
}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:var(--s2)}

.pill{
  display:inline-flex;align-items:center;padding:6px var(--s3);border-radius:var(--r-chip);
  font-size:calc(11.5px*var(--ui));letter-spacing:1.1px;text-transform:uppercase;font-weight:600;
  background:var(--sunken);color:var(--ink-soft);white-space:nowrap;
}
.pill.removed{background:var(--removed-bg);color:var(--removed-fg)}
.pill.kept{background:var(--kept-bg);color:var(--kept-fg)}
.pill.caution{background:var(--caution-bg);color:var(--caution-fg)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}

.field{display:flex;flex-direction:column;gap:5px}
.field-label{font-size:calc(12px*var(--ui));letter-spacing:.7px;text-transform:uppercase;color:var(--ink-muted)}
.input{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-field);
  padding:var(--s3) var(--s4);min-height:calc(52px*var(--ui));color:var(--ink-muted);
  font-size:calc(15.5px*var(--ui));display:flex;align-items:center;
}
.input.area{min-height:calc(104px*var(--ui));align-items:flex-start}
.input.focused{border:1.5px solid var(--accent);color:var(--ink)}

.icon{
  width:calc(42px*var(--ui));height:calc(42px*var(--ui));border-radius:50%;
  display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);
  flex:0 0 auto;font-size:calc(19px*var(--ui));
}
.icon.sq{border-radius:calc(13px*var(--ui))}
.icon.ghost{background:rgba(241,236,226,.13);color:var(--on-ink)}
.icon.plain{background:var(--surface);color:var(--ink);border:1px solid var(--hairline)}
.icon.sm{width:calc(34px*var(--ui));height:calc(34px*var(--ui));font-size:calc(15px*var(--ui))}

.ring{
  width:calc(64px*var(--ui));height:calc(64px*var(--ui));border-radius:50%;
  display:grid;place-items:center;font-size:calc(19px*var(--ui));color:var(--accent);
  background:conic-gradient(var(--accent) var(--pct,0%),var(--sunken) 0);
  position:relative;
}
.ring::after{
  content:'';position:absolute;inset:calc(5px*var(--ui));border-radius:50%;background:var(--surface);
}
.ring>span{position:relative;z-index:1}

.tabbar{
  position:absolute;left:var(--s5);right:var(--s5);bottom:var(--s3);
  display:flex;justify-content:space-around;gap:4px;padding:var(--s2);
  background:color-mix(in srgb,var(--surface) 94%,transparent);
  backdrop-filter:blur(18px);border:1px solid var(--hairline);
  border-radius:var(--r-tab);box-shadow:var(--shadow-float);
}
.tabbar button{
  display:flex;align-items:center;gap:6px;padding:var(--s2) var(--s4);
  border-radius:var(--r-chip);font-size:calc(14.5px*var(--ui));
  color:var(--ink-muted);font-weight:500;min-height:calc(42px*var(--ui));
}
.tabbar button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}

.progress{display:flex;gap:7px;align-items:center}
.progress i{height:7px;width:7px;border-radius:4px;background:var(--border);display:block}
.progress i.done{background:var(--accent);opacity:.65}
.progress i.now{width:26px;background:var(--accent)}

.strike{text-decoration:line-through;color:var(--ink-soft)}
.swatches{display:flex;gap:var(--s5)}
.swatch{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:calc(12.5px*var(--ui))}
.swatch i{width:calc(32px*var(--ui));height:calc(32px*var(--ui));border-radius:50%;display:block}
.swatch[aria-pressed="true"] i{box-shadow:0 0 0 3px var(--ink)}
.tiles{display:flex;gap:var(--s3)}
.tile{
  flex:1;min-height:calc(44px*var(--ui));border-radius:var(--r-field);
  background:var(--sunken);border:1px solid var(--hairline);
  display:grid;place-items:center;font-size:calc(13px*var(--ui));color:var(--ink-soft);
}
.tile[aria-pressed="true"]{background:var(--accent-soft);border:1.5px solid var(--accent);color:var(--accent);font-weight:600}
.toggle{
  width:calc(48px*var(--ui));height:calc(29px*var(--ui));border-radius:999px;
  background:var(--sunken);position:relative;flex:0 0 auto;
}
.toggle::after{
  content:'';position:absolute;top:3px;left:3px;width:calc(23px*var(--ui));height:calc(23px*var(--ui));
  border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .18s;
}
.toggle[aria-pressed="true"]{background:var(--accent-soft)}
.toggle[aria-pressed="true"]::after{left:calc(100% - 26px*var(--ui));background:var(--accent)}
.radio{
  width:calc(23px*var(--ui));height:calc(23px*var(--ui));border-radius:50%;
  border:1.5px solid var(--border);display:grid;place-items:center;flex:0 0 auto;
  font-size:calc(13px*var(--ui));color:transparent;
}
.radio[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.qbox{border-left:2px solid var(--accent-soft);padding-left:var(--s3)}
.numstep{font-family:ui-monospace,monospace;color:var(--accent);font-size:calc(13px*var(--ui));width:22px;flex:0 0 auto}

.screen{display:none}
.screen.on{display:block}

/* ── Responsive ──────────────────────────────────────────────────────────── */
@media (max-width:1180px){
  .stage{flex-direction:column;align-items:center;gap:18px}
  .caption-under{flex:0 0 auto}
}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .rail{
    position:sticky;top:0;z-index:20;flex-direction:row;flex-wrap:wrap;
    align-items:center;gap:10px;padding:12px 14px;
  }
  .rail h1{font-size:20px}
  .rail-label{display:none}
  .rail-group{flex-direction:row;flex-wrap:wrap;gap:4px;flex:1}
  .rail button{font-size:12px;padding:6px 9px}
  .controls{margin:0;padding:0;border:none;width:100%}
  .stage{padding:16px 12px}
}
@media (max-width:460px){
  /* Below the reference width, drop the device frame and scale the UI down so
     components shrink proportionately instead of clipping. */
  :root{--ui:.92}
  .stage{padding:0}
  .frame{
    width:100%;flex:1 1 auto;height:auto;min-height:82vh;border-radius:0;
    box-shadow:none;
  }
  .caption-under{padding:14px;max-width:none}
  .rail h1{font-size:18px}
}
</style>
</head>
<body data-theme="light" data-darkstyle="elevated">

<div class="app">
  <!-- ── Navigation rail ────────────────────────────────────────────────── -->
  <nav class="rail">
    <div>
      <div class="tag">Prototype</div>
      <h1>AIDr.</h1>
    </div>

    <div class="rail-group" id="nav"></div>

    <div class="controls">
      <button class="ctl" id="themeBtn" aria-pressed="false">Dark</button>
      <button class="ctl" id="dsBtn" aria-pressed="false" hidden>Warm ink</button>
      <div class="dots" id="accents"></div>
    </div>
  </nav>

  <!-- ── Stage ──────────────────────────────────────────────────────────── -->
  <main class="stage">
    <div class="frame">
      <div class="statusbar"><span id="clock">9:53</span><span>••∙ ⌾ 92</span></div>
      <div class="scroll" id="scroll"></div>
      <div class="footer" id="footer"></div>
      <div class="tabbar" id="tabbar" hidden></div>
    </div>
    <aside class="caption-under" id="caption"></aside>
  </main>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   Screens are declared as data. Each entry supplies its scroll body, its footer
   and whether the tab bar shows — so navigation is one function, not fifteen.
   ══════════════════════════════════════════════════════════════════════════ */

const CTA = (label, arrow = true) =>
  `<button class="btn ${arrow ? 'arrow' : ''}">${label}${arrow ? '<span>→</span>' : ''}</button>`;

const workflowForm = ({ eyebrow, lead, em, trail, desc, fields, chips = true, doc = true, cta }) => ({
  tabs: false,
  body: `
    <button class="icon plain" aria-label="Back">‹</button>
    <div style="margin-top:var(--s6)">
      <span class="eyebrow">${eyebrow}</span>
      <div class="display" style="margin-top:var(--s2)">${lead}<em>${em}</em>${trail}</div>
      <p class="body soft" style="margin-top:var(--s3)">${desc}</p>
    </div>

    <div class="card" style="margin-top:var(--s5)">
      <span class="eyebrow">Context included</span>
      <div class="row between" style="margin-top:var(--s3)">
        <div class="col grow">
          <span class="title">Apple Health</span>
          <span class="cap muted">Not connected</span>
        </div>
        <button class="btn secondary inline">Connect</button>
      </div>
    </div>

    <div class="section">
      <span class="eyebrow">Add notes · optional</span>
      <div class="stack">${fields}</div>
    </div>

    ${chips ? `<div class="section">
      <span class="eyebrow">Focus · optional</span>
      <div class="chips">
        ${['Sleep','Energy','Pain','Medication','Mood','Digestion']
          .map((c,i)=>`<button class="chip" aria-pressed="${i===0}">${i===0?'✓':'+'} ${c}</button>`).join('')}
      </div>
    </div>` : ''}

    ${doc ? `<button class="card row" style="margin-top:var(--s5);justify-content:center;border-radius:var(--r-field)">
      <span style="font-size:calc(18px*var(--ui))">⛶</span>
      <span class="title">Add from a document</span>
    </button>` : ''}

    <div class="card sunken row top" style="margin-top:var(--s5)">
      <span style="color:var(--accent);font-size:calc(17px*var(--ui))">⛨</span>
      <p class="cap grow">Redacted on this device, then sent with normalized health summaries to your
      gpt-5.6-terra account. Redaction is automated, so review your text first.</p>
    </div>`,
  footer: CTA(cta),
});

const field = (label, ph, area = false, focused = false) => `
  <div class="field">
    <span class="field-label">${label}</span>
    <div class="input ${area ? 'area' : ''} ${focused ? 'focused' : ''}">${ph}</div>
  </div>`;

const SCREENS = {

/* ─── Onboarding ─────────────────────────────────────────────────────────── */
welcome: {
  group:'Onboarding', label:'1 · Welcome', tabs:false,
  note:['Welcome','The three promises come first, before any feature list. Serif display with one accent-italic phrase — the signature treatment used on every headline in the app.'],
  body:`
    <button class="icon plain" aria-label="Back">‹</button>
    <div class="progress" style="margin-top:var(--s5)">
      <i class="now"></i><i></i><i></i><i></i><i></i><i></i><i></i>
    </div>
    <div class="row" style="margin-top:var(--s5)">
      <span class="icon sq" style="background:var(--ink);color:var(--on-ink);font-family:var(--serif)">A</span>
      <div class="col">
        <span class="eyebrow">AIDr.</span>
        <span class="body soft">Private health intelligence</span>
      </div>
    </div>
    <span class="eyebrow" style="display:block;margin-top:var(--s5)">Welcome</span>
    <div class="display" style="margin-top:var(--s2)">Understand your <em>health record</em> before the visit.</div>
    <p class="body soft" style="margin-top:var(--s4)">AIDr. reads the health data you authorise, redacts
    identifiers on your device, then helps you turn your own numbers into questions worth asking.</p>
    <div class="card flat" style="margin-top:var(--s5)">
      ${[['⛨','On-device redaction first','Names, dates and identifiers are stripped locally before anything is sent.'],
         ['▤','You stay in control','Read-only health access, normalized summaries only, kept on your device.'],
         ['✦','Guided workflows','Visit prep, result explanations, medication review and document summaries.']]

/* ═══ Wiring ═══════════════════════════════════════════════════════════════ */
const TABS = { home:'Home', journal:'Journal', settings:'Settings' };
const TAB_ICON = { home:'⌂', journal:'▢', settings:'⚙' };
const ACCENTS = ['clay','sage','amber','rose'];
const ACCENT_LABEL = { clay:'Clay', sage:'Sage', amber:'Amber', rose:'Rose' };

const $ = (id) => document.getElementById(id);
let current = 'homeSynced';

// Build the rail, grouped.
(() => {
  const groups = {};
  for (const [key, s] of Object.entries(SCREENS)) {
    (groups[s.group] ??= []).push([key, s.label]);
  }
  $('nav').innerHTML = Object.entries(groups)
    .map(([g, items]) =>
      `<div class="rail-label">${g}</div>` +
      items.map(([k, l]) => `<button data-go="${k}">${l}</button>`).join(''))
    .join('');
})();

// Accent dots in the rail.
$('accents').innerHTML = ACCENTS.map(a =>
  `<button class="dot" data-accent="${a}" aria-label="${ACCENT_LABEL[a]} accent"
     aria-pressed="${a === 'clay'}" style="background:var(--${a})"></button>`).join('');

function setAccent(name) {
  const r = document.documentElement.style;
  r.setProperty('--accent', `var(--${name})`);
  r.setProperty('--accent-soft', `var(--${name}-soft)`);
  r.setProperty('--accent-deep', `var(--${name}-deep)`);
  document.querySelectorAll('[data-accent]').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.accent === name)));
}

function render(key) {
  const s = SCREENS[key];
  if (!s) return;
  current = key;

  $('scroll').innerHTML = s.body;
  $('scroll').scrollTop = 0;
  $('footer').innerHTML = s.footer || '';
  $('footer').hidden = !s.footer;

  const tabbar = $('tabbar');
  if (s.tabs && s.tabs !== false) {
    tabbar.hidden = false;
    tabbar.innerHTML = Object.entries(TABS).map(([k, l]) =>
      `<button aria-current="${k === s.tabs}">${TAB_ICON[k]} ${l}</button>`).join('');
    // Leave room for the floating bar.
    $('scroll').style.paddingBottom = '104px';
  } else {
    tabbar.hidden = true;
    $('scroll').style.paddingBottom = '8px';
  }

  $('caption').innerHTML = s.note
    ? `<strong>${s.note[0]}</strong>${s.note[1]}`
    : '';

  document.querySelectorAll('[data-go]').forEach(b =>
    b.setAttribute('aria-current', String(b.dataset.go === key)));

  if (key === 'settings') paintSettingsControls();
}

/** The Settings appearance controls drive the real theme, not a mock. */
function paintSettingsControls() {
  const sa = $('settingsAccents');
  if (sa) {
    sa.innerHTML = ACCENTS.map(a =>
      `<button class="swatch" data-accent="${a}" aria-pressed="${isAccent(a)}">
         <i style="background:var(--${a})"></i>${ACCENT_LABEL[a]}</button>`).join('');
  }
  const st = $('settingsTheme');
  if (st) {
    const mode = document.body.dataset.theme;
    st.innerHTML = ['light', 'dark'].map(m =>
      `<button class="tile" data-theme="${m}" aria-pressed="${mode === m}">
         ${m === 'light' ? 'Light' : 'Dark'}${mode === m ? ' ✓' : ''}</button>`).join('');
  }
  const sd = $('settingsDark');
  if (sd) {
    const ds = document.body.dataset.darkstyle;
    sd.innerHTML = [['elevated', 'Elevated'], ['warm', 'Warm ink'], ['dim', 'Dim']].map(([v, l]) =>
      `<button class="tile" data-darkstyle="${v}" aria-pressed="${ds === v}">
         ${l}${ds === v ? ' ✓' : ''}</button>`).join('');
  }
}

function isAccent(name) {
  return getComputedStyle(document.documentElement)
    .getPropertyValue('--accent').trim() === `var(--${name})`
    || document.querySelector(`.dot[data-accent="${name}"]`)?.getAttribute('aria-pressed') === 'true';
}

function setTheme(mode) {
  document.body.dataset.theme = mode;
  const btn = $('themeBtn');
  btn.textContent = mode === 'dark' ? 'Light' : 'Dark';
  btn.setAttribute('aria-pressed', String(mode === 'dark'));
  $('dsBtn').hidden = mode !== 'dark';
  if (current === 'settings') paintSettingsControls();
}

// Delegated events — one listener for the whole prototype.
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-go],[data-accent],[data-theme],[data-darkstyle],.chip,.toggle,.radio,.tile');
  if (!t) return;

  if (t.dataset.go) return render(t.dataset.go);
  if (t.dataset.accent) { setAccent(t.dataset.accent); if (current === 'settings') paintSettingsControls(); return; }
  if (t.dataset.theme) return setTheme(t.dataset.theme);
  if (t.dataset.darkstyle) { document.body.dataset.darkstyle = t.dataset.darkstyle; return paintSettingsControls(); }

  // Generic pressable toggle for chips, switches and radios.
  if (t.classList.contains('radio') || t.classList.contains('toggle') || t.classList.contains('chip')) {
    const on = t.getAttribute('aria-pressed') === 'true';
    t.setAttribute('aria-pressed', String(!on));
    if (t.classList.contains('chip') && !t.closest('#settingsAccents')) {
      t.textContent = t.textContent.replace(on ? '✓' : '+', on ? '+' : '✓');
    }
  }
});

$('themeBtn').addEventListener('click', () =>
  setTheme(document.body.dataset.theme === 'dark' ? 'light' : 'dark'));

$('dsBtn').addEventListener('click', () => {
  const order = ['elevated', 'warm', 'dim'];
  const next = order[(order.indexOf(document.body.dataset.darkstyle) + 1) % 3];
  document.body.dataset.darkstyle = next;
  $('dsBtn').textContent = { elevated: 'Elevated', warm: 'Warm ink', dim: 'Dim' }[next];
});

// Keyboard navigation through the deck.
document.addEventListener('keydown', (e) => {
  if (e.target.matches('input,textarea')) return;
  const keys = Object.keys(SCREENS);
  const i = keys.indexOf(current);
  if (e.key === 'ArrowRight' || e.key === 'j') render(keys[(i + 1) % keys.length]);
  if (e.key === 'ArrowLeft' || e.key === 'k') render(keys[(i - 1 + keys.length) % keys.length]);
});

// Live clock in the status bar, because a frozen 9:41 is a tell.
setInterval(() => {
  $('clock').textContent = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
}, 10_000);
$('clock').textContent = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });

render(current);
</script>
